name: AI Director MVP tests

on:
  push:
    paths:
      - "短视频/ai-director/**"
      - ".github/workflows/ai-director-tests.yml"
  pull_request:
    paths:
      - "短视频/ai-director/**"
      - ".github/workflows/ai-director-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install verified OSS test and schema validators
        run: |
          python -m pip install "coverage==7.16.1"
          python -m pip install "opentimelineio==0.18.1"
          python -m pip install -r "短视频/ai-director/requirements-schema.txt"
          python -m pip install -r "短视频/ai-director/requirements-media.txt"
      - name: Install FFmpeg for actual decoded-frame media regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Run AI Director unit tests with branch coverage
        working-directory: "短视频/ai-director"
        run: |
          python -m coverage run --branch --source=director_av_sync_smoke,director_picture_render_smoke,director_media_otio_export,director_montage_editor_conform,director_editorial_montage,director_speech_cues,director_shot_coverage,series_final_timeline,director_artistic_methods,director_delivery_review,director_visual_language,director_department_command,director_creative_cut,screenplay_series_delivery,screenplay_development,screenplay_professional_review,screenplay_fulltext_intake,screenplay_director_handoff,screenplay_adaptation,closing_evidence_card,seedance_adapter,video_workflow,article_intake,editorial_storyboard,editorial_review_lock,creative_production_handoff,film_continuity,asset_reference_manifest,agent_team,agent_role_contracts,role_schema_guard,agent_live_pilot,agent_live_crew,private_result_checkpoint,agent_provider_wire,agent_handoff_audit,agent_creative_review,production_delivery,director_v2,director_workbook,one_time_deepseek_cloud_trial,agent_executor,local_director,llm_budget,director_timeline,director_shootability,director_narrative_bridges -m unittest discover -s tests -v
          python -m coverage json -o /tmp/ai-director-branch-coverage.json
          python -m coverage report -m
          python audit_registry.py --summary-out /tmp/ai-director-audit-registry-summary.json
          # Quality-phase charter and issue board: every item must be traceable
          # and no art/media problem may be falsely marked fully completed.
          python quality-optimization/quality_registry.py --check-board
          python local_director.py doctor
          python -m py_compile quality-optimization/quality_registry.py director_av_sync_smoke.py director_picture_render_smoke.py director_media_otio_export.py director_montage_editor_conform.py director_editorial_montage.py director_speech_cues.py director_shot_coverage.py series_final_timeline.py director_artistic_methods.py director_delivery_review.py director_visual_language.py director_department_command.py director_creative_cut.py screenplay_series_delivery.py screenplay_development.py screenplay_professional_review.py screenplay_fulltext_intake.py screenplay_director_handoff.py screenplay_adaptation.py closing_evidence_card.py audit_registry.py local_director.py local_ui.py llm_budget.py agent_team.py agent_handoff_audit.py agent_creative_review.py creative_production_handoff.py film_continuity.py asset_reference_manifest.py agent_executor.py agent_role_contracts.py role_schema_guard.py agent_model_gateway.py article_intake.py editorial_storyboard.py editorial_review_lock.py production_delivery.py agent_live_pilot.py agent_live_crew.py private_result_checkpoint.py offline_vertical_demo.py live_pilot_readiness.py one_time_deepseek_cloud_trial.py agent_provider_wire.py agent_durable_preflight.py director_v2.py director_workbook.py
          # Public sample only: compile a readable operator work-order pack
          # into temporary CI storage. Never submit real/private scripts.
          python production_delivery.py --base examples/quit-smoking/plan.json --direction examples/quit-smoking/direction_v02.json --out-json /tmp/ai-director-operator-work-orders.json --out-md /tmp/ai-director-operator-work-orders.md
          python director.py validate --plan examples/quit-smoking/plan.json
          python director.py compile --plan examples/quit-smoking/plan.json --out /tmp/ai-director-prompts.json
          python director.py preview --plan examples/quit-smoking/plan.json --out /tmp/ai-director-preview.html
          python director_v2.py validate --base examples/quit-smoking/plan.json --direction examples/quit-smoking/direction_v02.json
          python director_v2.py compile --base examples/quit-smoking/plan.json --direction examples/quit-smoking/direction_v02.json --out /tmp/ai-director-v02-prompts.json
          python director_v2.py preview --base examples/quit-smoking/plan.json --direction examples/quit-smoking/direction_v02.json --out /tmp/ai-director-v02-preview.html
          # Three-part long-script scenario: validate source-linked credit cards and professional beats
          for episode in ep01-attention ep02-sleep ep03-emotions; do
            base="examples/energy-trilogy/$episode/plan.json"
            direction="examples/energy-trilogy/$episode/direction_v02.json"
            python director_v2.py validate --base "$base" --direction "$direction"
            python director_v2.py compile --base "$base" --direction "$direction" --out "/tmp/$episode-prompts.json"
            python director_v2.py preview --base "$base" --direction "$direction" --out "/tmp/$episode-preview.html"
          done


      # Entirely invented letter story. No user scripts, API keys, real model
      # responses, spend, network calls or media are involved in this demo.
      - name: Build public synthetic complete vertical example
        working-directory: "短视频/ai-director"
        run: |
          python offline_vertical_demo.py --synthetic-only --output-dir /tmp/ai-director-complete-synthetic-demo
          python live_pilot_readiness.py --public-fiction-only --out /tmp/ai-director-complete-synthetic-demo/DEEPSEEK_FLASH_REAL_PILOT_READINESS_NO_CALL.json
      - name: Attach public synthetic operator review pack
        uses: actions/upload-artifact@v6
        with:
          name: ai-director-SYNTHETIC-NOT-REAL-AI-operator-pack
          path: /tmp/ai-director-complete-synthetic-demo/
          retention-days: 7
          if-no-files-found: error

      - name: Attach module branch-coverage baseline (no scripts or secrets)
        uses: actions/upload-artifact@v6
        with:
          name: ai-director-COVERAGE-BASELINE-ONLY
          path: /tmp/ai-director-branch-coverage.json
          retention-days: 7
          if-no-files-found: error
      - name: Attach public audit status metadata
        uses: actions/upload-artifact@v6
        with:
          name: ai-director-AUDIT-STATUS-PUBLIC-ONLY
          path: /tmp/ai-director-audit-registry-summary.json
          retention-days: 7
          if-no-files-found: error
