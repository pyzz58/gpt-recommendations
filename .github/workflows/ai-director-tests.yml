name: AI Director MVP tests

on:
  push:
    paths:
      - "短视频/ai-director/**"
      - ".github/workflows/ai-director-tests.yml"
  pull_request:
    paths:
      - "短视频/ai-director/**"
      - ".github/workflows/ai-director-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run AI Director unit tests
        working-directory: "短视频/ai-director"
        run: |
          python -m unittest discover -s tests -v
          python director.py validate --plan examples/quit-smoking/plan.json
          python director.py compile --plan examples/quit-smoking/plan.json --out /tmp/ai-director-prompts.json
          python director.py preview --plan examples/quit-smoking/plan.json --out /tmp/ai-director-preview.html
          python director_v2.py validate --base examples/quit-smoking/plan.json --direction examples/quit-smoking/direction_v02.json
          python director_v2.py compile --base examples/quit-smoking/plan.json --direction examples/quit-smoking/direction_v02.json --out /tmp/ai-director-v02-prompts.json
          python director_v2.py preview --base examples/quit-smoking/plan.json --direction examples/quit-smoking/direction_v02.json --out /tmp/ai-director-v02-preview.html
