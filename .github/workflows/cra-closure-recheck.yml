name: CRA residual closure forward acceptance 20261101
on:
  push:
    branches: ['audit/cra-closure-recheck-20261101']
    paths:
      - 'cra system/audit/probes/closure_branch_20261101.py'
      - '.github/workflows/cra-closure-recheck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-closure-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 'cra system'
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          POSTGRES_DB: cra_recheck
          POSTGRES_USER: cra
          POSTGRES_PASSWORD: synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cra -d cra_recheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRA_ENV: test
      CRA_DATABASE_URL: postgresql+psycopg://cra:synthetic@127.0.0.1:5432/cra_recheck
      CRA_TEST_DATABASE_URL: postgresql+psycopg://cra:synthetic@127.0.0.1:5432/cra_recheck
      CRA_COMMON_POLICY_PATH: tests/fixtures/rules/common_policy.json
      CRA_OCR_PROVIDER: disabled
      CRA_ANALYSIS_PROVIDER: disabled
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install existing locked dependencies
        run: |
          python -m pip install uv==0.12.13
          uv sync --frozen --group dev
      - name: Migrate disposable PostgreSQL through 0009
        run: uv run --frozen alembic upgrade head
      - name: Verify original fixes and branch-linked boundaries
        run: >-
          uv run --frozen pytest -q -s
          tests/integration/test_subjects.py::test_nested_visit_windows_inherit_parent_gates_and_keep_out_of_window
          tests/integration/test_subjects.py::test_sibling_equal_visit_windows_keep_distinct_condition_paths
          tests/integration/test_rules.py::test_shared_project_rule_can_have_independent_site_adoption_dates
          tests/integration/test_rules.py::test_independent_site_rule_cannot_hide_same_key_project_rule
          tests/integration/test_laboratory.py::test_succeeded_job_redelivery_is_noop_before_provider
          tests/integration/test_laboratory.py::test_public_retry_recovers_expired_lease_but_protects_live_lease
          tests/integration/test_laboratory.py::test_obsolete_attempt_cannot_overwrite_new_result_or_cra_correction
          audit/probes/closure_branch_20261101.py
