name: CRA independent review diagnostics 20261101
on:
  push:
    branches: ['cra-system/review-20261101']
    paths:
      - 'cra system/audit/**'
      - '.github/workflows/cra-review-20261101.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 'cra system'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.15'
      - name: Install existing locked application dependencies
        run: |
          python -m pip install uv==0.12.13
          uv sync --frozen --group dev
      - name: Reproduce reviewer counterexamples (not clinical acceptance)
        run: uv run --frozen python audit/probes/review_20261101.py
