name: CRA System baseline
on:
  push:
    branches: [main, 'cra-system/**', 'codex/**']
    paths: ['cra system/**', '.github/workflows/cra-system.yml', '.devcontainer/cra-system/**']
  pull_request:
    paths: ['cra system/**', '.github/workflows/cra-system.yml', '.devcontainer/cra-system/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: cra-system-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cra-w02:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 'cra system'
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          POSTGRES_DB: cra_w02
          POSTGRES_USER: cra
          POSTGRES_PASSWORD: synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cra -d cra_w02"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRA_ENV: synthetic
      CRA_DATABASE_URL: postgresql+psycopg://cra:synthetic@127.0.0.1:5432/cra_w02
      CRA_TEST_DATABASE_URL: postgresql+psycopg://cra:synthetic@127.0.0.1:5432/cra_w02
      CRA_SESSION_SECRET: synthetic-ci-only-session-secret
      CRA_SESSION_COOKIE_SECURE: 'false'
      CRA_SYNTHETIC_ACTOR_ID: synthetic-cra
      CRA_SYNTHETIC_TENANT_ID: synthetic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
          cache-dependency-path: 'cra system/web/package-lock.json'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.13
          uv sync --frozen --group dev
          npm --prefix web ci
      - name: migrate
        run: uv run --frozen alembic upgrade head
      - name: api
        run: uv run --frozen pytest -q tests/api/test_platform.py
      - name: test
        run: npm --prefix web run test
      - name: typecheck
        run: npm --prefix web run typecheck
      - name: build
        run: npm --prefix web run build
      - name: contracts
        run: npm --prefix web run api:check
      - name: runtime-smoke
        run: bash tools/smoke_w02.sh
      - name: devcontainer-smoke
        run: |
          npx --yes @devcontainers/cli@0.90.0 up \
            --workspace-folder "$GITHUB_WORKSPACE" \
            --config "$GITHUB_WORKSPACE/.devcontainer/cra-system/devcontainer.json" \
            --remove-existing-container
          npx --yes @devcontainers/cli@0.90.0 exec \
            --workspace-folder "$GITHUB_WORKSPACE" \
            --config "$GITHUB_WORKSPACE/.devcontainer/cra-system/devcontainer.json" \
            bash -lc 'bash tools/smoke_w02.sh'

  cra-w01:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 'cra system'
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
        env:
          POSTGRES_DB: cra_w01
          POSTGRES_USER: cra
          POSTGRES_PASSWORD: synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cra -d cra_w01"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRA_ENV: synthetic
      CRA_DATABASE_URL: postgresql+psycopg://cra:synthetic@127.0.0.1:5432/cra_w01
      CRA_TEST_DATABASE_URL: postgresql+psycopg://cra:synthetic@127.0.0.1:5432/cra_w01
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.13
          uv sync --frozen --group dev
      - name: migrate
        run: uv run --frozen alembic upgrade head
      - name: test
        run: uv run --frozen pytest -q tests/integration/test_governance.py

  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 'cra system'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check theory and technical synchronization
        env:
          CRA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python3 tools/check_traceability.py
      - name: Validate core behaviors and synchronization failures
        run: python3 -m unittest discover -s tests -v
      - name: Exercise the synthetic monitoring example
        env:
          PYTHONPATH: backend
        run: python3 -m cra_core.demo
      - name: Verify task-specific completion evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/task_evidence.py
      - name: Show next development work package
        run: python3 tools/next_task.py
      - name: Diagnostic architecture review probes (not acceptance)
        run: python3 audit/probes/reproduce_review.py
