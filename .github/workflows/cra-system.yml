name: CRA System baseline
on:
  push:
    branches: [main, 'cra-system/**']
    paths: ['cra system/**', '.github/workflows/cra-system.yml', '.devcontainer/cra-system/**']
  pull_request:
    paths: ['cra system/**', '.github/workflows/cra-system.yml', '.devcontainer/cra-system/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cra-system-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: 'cra system'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check theory and technical synchronization
        env:
          CRA_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python3 tools/check_traceability.py
      - name: Validate core behaviors and synchronization failures
        run: python3 -m unittest discover -s tests -v
      - name: Exercise the synthetic monitoring example
        env:
          PYTHONPATH: backend
        run: python3 -m cra_core.demo
