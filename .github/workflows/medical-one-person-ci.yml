name: Medical One Person - application CI

on:
  push:
    paths:
      - '医疗一人项目/**'
      - '.github/workflows/medical-one-person-ci.yml'
  pull_request:
    paths:
      - '医疗一人项目/**'
      - '.github/workflows/medical-one-person-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medical-one-person-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medical_one_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medical_one_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: 医疗一人项目
    env:
      MEDICAL_ONE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/medical_one_test
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.13
          corepack prepare pnpm@11.25.0 --activate
          uv sync --project services/core --locked
          pnpm install --frozen-lockfile
      - name: PostgreSQL application tests
        run: uv run --project services/core --frozen pytest services/core/tests -q
      - name: Static checks
        run: |
          uv run --project services/core --frozen ruff check services/core
          uv run --project services/core --frozen mypy services/core/src
      - name: Migration round-trip
        env:
          MEDICAL_ONE_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/medical_one_test
        run: |
          cd services/core
          uv run --frozen alembic upgrade head
          uv run --frozen alembic downgrade b2e7d4a9c310
          uv run --frozen alembic upgrade head
      - name: Web checks
        run: |
          pnpm --dir apps/web lint
          pnpm --dir apps/web typecheck
          pnpm --dir apps/web build
      - name: Traceability self-tests
        run: python3 tools/test_traceability.py
