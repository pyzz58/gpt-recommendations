name: Newspaper - isolated AI diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/newspaper-ai-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check existing newspaper AI credential without exposing it
        env:
          NEWSPAPER_LLM_API_KEY: ${{ secrets.NEWSPAPER_LLM_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          key = os.environ.get("NEWSPAPER_LLM_API_KEY", "").strip()
          def emit(label, value):
              print("NEWSPAPER_AI_DIAGNOSTIC " + label + "=" + str(value), flush=True)
          def call(path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request("https://api.deepseek.com" + path, data=data,
                  headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  return exc.code, {}
              except Exception:
                  return 0, {}
          if not key:
              emit("result", "MISSING_KEY")
              raise SystemExit(1)
          status, data = call("/user/balance")
          emit("balance_http", status)
          available = data.get("is_available")
          if isinstance(available, bool):
              emit("balance_available", str(available).lower())
          if status == 401:
              emit("result", "AUTHENTICATION_FAILED")
              raise SystemExit(1)
          if status == 402 or available is False:
              emit("result", "INSUFFICIENT_BALANCE")
              raise SystemExit(1)
          # At most one tiny request, with the same model and parameters as production.
          status, data = call("/chat/completions", {
              "model": "deepseek-flash",
              "messages": [{"role": "user", "content": 'Return JSON: {"ok":true}'}],
              "max_tokens": 16, "thinking": {"type": "disabled"},
              "response_format": {"type": "json_object"}, "stream": False})
          emit("completion_http", status)
          reason = {200: "API_AVAILABLE", 400: "INVALID_FORMAT", 401: "AUTHENTICATION_FAILED",
              402: "INSUFFICIENT_BALANCE", 403: "ACCESS_DENIED", 404: "MODEL_OR_ENDPOINT_UNAVAILABLE",
              422: "INVALID_PARAMETERS", 429: "RATE_LIMITED", 500: "PROVIDER_ERROR",
              503: "PROVIDER_OVERLOADED", 0: "NETWORK_OR_RESPONSE_ERROR"}.get(status, "OTHER_HTTP_ERROR")
          emit("result", reason)
          raise SystemExit(0 if status == 200 else 1)
          PY
