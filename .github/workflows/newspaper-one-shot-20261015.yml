name: Newspaper one-shot 2026-10-15
on:
  schedule:
    - cron: '57 20 14 10 *'
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch latest production newspaper
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/actions/workflows/newspaper.yml/dispatches" -f ref=main -f 'inputs[dry_run]=false'
