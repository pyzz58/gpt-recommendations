# Read-only discriminator for GitHub schedule registration vs. newsletter jobs.
# NEVER reads SMTP/LLM secrets, prepares editions, or sends mail.
# Temporary hourly probe for P0 investigation; remove after diagnosis.
name: Newspaper - Schedule Trigger Probe
on:
  schedule:
    - cron: '37 * * * *'
  push:
    branches: [main]
    paths:
      - 'newspaper/schedule_probe_marker.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trigger-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect newspaper workflow registered state (read-only API)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          url = ("https://api.github.com/repos/" + os.environ["REPO_SLUG"]
                 + "/actions/workflows/newspaper.yml")
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          try:
              with urllib.request.urlopen(req, timeout=15) as response:
                  data=json.load(response)
              print("NEWSPAPER_MAIN_WORKFLOW_STATE=" + json.dumps({
                  "id":data.get("id"), "state":data.get("state"),
                  "path":data.get("path"), "name":data.get("name")
              },sort_keys=True))
          except urllib.error.HTTPError as error:
              print("NEWSPAPER_MAIN_WORKFLOW_STATE_UNVERIFIED_HTTP=" + str(error.code))
          except (TimeoutError, OSError, ValueError) as error:
              print("NEWSPAPER_MAIN_WORKFLOW_STATE_UNVERIFIED=" + type(error).__name__)
          PY
      - name: Record actual event and UTC execution time (no mail)
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          printf 'NEWSPAPER_TRIGGER_PROOF event=%s scheduled_cron=%s run_id=%s sha=%s execution_utc=%s\n' \
            "$EVENT_NAME" "$EVENT_SCHEDULE" "$RUN_ID" "$COMMIT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$EVENT_NAME" == schedule ]]; then
            echo 'NEWSPAPER_CRON_REAL_EVENT=true'
          else
            echo 'NEWSPAPER_CRON_REAL_EVENT=false (manual or push test is NOT a schedule event)'
          fi
          {
            echo '### Newspaper scheduler registration probe'
            echo "- Event: $EVENT_NAME"
            echo "- Actual UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo '- Independent of newspaper content and QQ SMTP'
          } >> "$GITHUB_STEP_SUMMARY"
