name: Newspaper one-time schedule startup probe
on:
  schedule:
    - cron: '17 20 * * *'
permissions:
  contents: read
jobs:
  startup-probe:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record one-time startup evidence
        run: |
          echo "event=$GITHUB_EVENT_NAME run_id=$GITHUB_RUN_ID utc=$(date -u +%FT%TZ)"
          if [[ "$(date -u +%F)" != "2026-10-14" ]]; then
            echo "Outside one-time test date: skip"
            exit 0
          fi
          echo "SCHEDULE_TRIGGER_CONFIRMED run_id=$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
