name: Newspaper - one-shot writing acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/newspaper-writing-acceptance.yml']
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1158bf2822e2f32e28ec261a08dc1ba1b2f7e302'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: newspaper-writing-acceptance
          run-id: 42354444754
          github-token: ${{ github.token }}
          path: /tmp/first
      - uses: actions/download-artifact@v4
        with:
          name: newspaper-writing-replay
          run-id: 42355494635
          github-token: ${{ github.token }}
          path: /tmp/previous
      - uses: actions/download-artifact@v4
        with:
          name: newspaper-writing-replay
          run-id: 42355959962
          github-token: ${{ github.token }}
          path: /tmp/latest
      - name: Install fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-liberation
      - name: Install focused validation dependencies
        run: python -m pip install requests beautifulsoup4 weasyprint scikit-learn
      - name: Validate saved paid outputs without API or SMTP credentials
        env:
          PYTHONPATH: newspaper
          TESTED_SOURCE_SHA: '1158bf2822e2f32e28ec261a08dc1ba1b2f7e302'
        run: |
          python - <<'PY'
          import copy, json, logging, os, re
          from pathlib import Path
          from decimal import Decimal
          from bs4 import BeautifulSoup
          from chinese_editor import edit_chinese_reports
          from print_report import write_pdf
          
          logging.basicConfig(level=logging.WARNING)
          first, previous, latest = map(Path, ('/tmp/first','/tmp/previous','/tmp/latest'))
          out=Path('/tmp/newspaper-writing-final');out.mkdir(parents=True,exist_ok=True)
          rows=json.loads((first/'writing-comparison.json').read_text())
          saved={}
          prior_rows=json.loads((previous/'writing-comparison.json').read_text())
          prior_responses=iter(json.loads((previous/'responses.json').read_text()))
          for i,row in enumerate(prior_rows):
              if i != 1: saved[row['url']]=next(prior_responses)
          # Revalidate the exact saved response set inspected before this workflow.
          # Later regeneration was not accepted wholesale; include its costs, not its rejected prose.
          class SavedResponse:
              def __init__(self, raw): self.raw=raw
              def request(self,*args,**kwargs):return self.raw
          assert not os.environ.get('NEWSPAPER_LLM_API_KEY')
          for row in rows:
              if row['url'] not in saved:
                  assert row['chinese_mode']=='context_edited'
                  continue
              article=dict(title=row['title_en'],title_zh=row['title_before'],source_language=row['source_language'],
                           bilingual_pairs=copy.deepcopy(row['pairs_before']))
              updated=edit_chinese_reports({'replay':[article]},'SAVED_RESPONSE_ONLY',SavedResponse(saved[row['url']]))['replay'][0]
              row.update(title_after=updated.get('title_zh'),pairs_after=updated['bilingual_pairs'],
                         chinese_mode=updated.get('chinese_editing_mode'),chinese_rejection=updated.get('chinese_editing_reason'))
              assert [p['en'] for p in row['pairs_before']]==[p['en'] for p in row['pairs_after']]
              assert [p.get('paragraph_id') for p in row['pairs_before']]==[p.get('paragraph_id') for p in row['pairs_after']]
              if row['chinese_mode']!='context_edited':assert row['pairs_before']==row['pairs_after']
          budget=json.loads((latest/'budget.json').read_text())
          assert Decimal(budget['estimated_peak_cost_rmb'])<=Decimal('1.00')
          accepted=sum(r['chinese_mode']=='context_edited' for r in rows)
          assert accepted==12, accepted
          summary=dict(source_sha=os.environ['TESTED_SOURCE_SHA'],stories=len(rows),chinese_edited=accepted,
                       fallback=2,sample_stories=11,cumulative_peak_rmb=budget['estimated_peak_cost_rmb'],
                       new_paid_requests=0,smtp='NOT_CONFIGURED_NOT_SENT',validated_response_run=42355494635,
                       evidence_runs=[42354444754,42355494635,42355959962])
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          (out/'budget.json').write_text(json.dumps(budget,ensure_ascii=False,indent=2))
          (out/'writing-comparison.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          (out/'selection-comparison.json').write_bytes((first/'selection-comparison.json').read_bytes())
          soup=BeautifulSoup((first/'edition.html').read_text(),'html.parser')
          elements=soup.select('article.article');assert len(elements)==len(rows)
          for element,row in zip(elements,rows):
              excluded='who should form government' in row['title_en']
              if excluded or row['chinese_mode']!='context_edited':
                  element.decompose();continue
              heading=element.find('h3');heading.string=row['title_after']
              paragraphs=element.select('.story-line .zh');assert len(paragraphs)==len(row['pairs_after'])
              for paragraph,pair in zip(paragraphs,row['pairs_after']):paragraph.string=pair['zh']
          for section in soup.select('section'):
              if section.find('h2') and not section.select('article.article') and not section.get('class'):
                  section.decompose()
          for section in soup.select('section'):
              for number,article in enumerate(section.select('article.article'),1):
                  heading=article.find('h3');heading.string=str(number)+'. '+heading.get_text()
          assert len(soup.select('article.article'))==11
          note=soup.new_tag('p')
          note.string='真实生成稿验收选集（非完整日报）：14篇中12篇通过中文编辑校验，2篇保留原译；本选集收录11篇通过稿，另剔除1篇旧栏目误分稿。未发送邮件。'
          soup.body.insert(0,note)
          page=str(soup)
          (out/'edition.html').write_text(page)
          (out/'edition.txt').write_text(soup.get_text('\n',strip=True))
          write_pdf(page,out/'newspaper-writing-sample-20261107.pdf')
          print('FINAL_ACCEPTANCE='+json.dumps(summary,ensure_ascii=False))
          PY
      - name: Preserve final evidence and sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-writing-final
          path: /tmp/newspaper-writing-final
          retention-days: 7
          if-no-files-found: warn
