name: Newspaper - one-shot writing acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/newspaper-writing-acceptance.yml']
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '65519a0d56024202beb56d8405e61937111bb678'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: newspaper-writing-acceptance
          run-id: 42354444754
          github-token: ${{ github.token }}
          path: /tmp/first
      - name: Install fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-liberation
      - name: Install focused replay dependencies
        run: python -m pip install requests scikit-learn beautifulsoup4 weasyprint
      - name: Replay same stories with cumulative issue budget
        env:
          NEWSPAPER_LLM_API_KEY: ${{ secrets.NEWSPAPER_LLM_API_KEY }}
          TESTED_SOURCE_SHA: '65519a0d56024202beb56d8405e61937111bb678'
          PYTHONPATH: newspaper
        run: |
          python - <<'PY'
          import copy, json, logging, os
          from collections import Counter
          from decimal import Decimal
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          from chinese_editor import edit_chinese_reports
          from edition_budget import EditionBudget
          from print_report import write_pdf
          
          logging.basicConfig(level=logging.INFO)
          first = Path('/tmp/first')
          out = Path('/tmp/newspaper-writing-replay')
          out.mkdir(parents=True, exist_ok=True)
          rows = json.loads((first/'writing-comparison.json').read_text())
          prior = json.loads((first/'budget.json').read_text())[0]
          ledger = EditionBudget()
          ledger.spent_ceiling = Decimal(prior['estimated_peak_cost_rmb'])
          ledger.requests = prior['request_count']
          ledger.breakdown = copy.deepcopy(prior['calls'])
          assert not any(os.environ.get(k) for k in ('SMTP_PASSWORD','SMTP_FROM','NEWSPAPER_TO'))
          responses = []
          def capture(*args, **kwargs):
              response = requests.post(*args, **kwargs)
              if response.status_code == 200:
                  responses.append(response.json().get('choices', [{}])[0].get('message', {}).get('content'))
              return response
          try:
              for index, row in enumerate(rows):
                  if row['chinese_mode'] == 'context_edited':
                      continue
                  article = dict(title=row['title_en'], title_zh=row['title_before'],
                                 source_language=row['source_language'], bilingual_pairs=copy.deepcopy(row['pairs_before']))
                  updated = edit_chinese_reports({'replay':[article]}, os.environ['NEWSPAPER_LLM_API_KEY'], ledger,
                                                 transport=capture)['replay'][0]
                  row.update(title_after=updated.get('title_zh'), pairs_after=updated['bilingual_pairs'],
                             chinese_mode=updated.get('chinese_editing_mode'), chinese_rejection=updated.get('chinese_editing_reason'))
                  print('REPLAY_STORY', index, row['chinese_mode'], row['chinese_rejection'], flush=True)
          finally:
              (out/'writing-comparison.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
              (out/'responses.json').write_text(json.dumps(responses,ensure_ascii=False,indent=2))
              (out/'budget.json').write_text(json.dumps(ledger.snapshot(),ensure_ascii=False,indent=2))
          summary = dict(source_sha=os.environ['TESTED_SOURCE_SHA'], reused_run=42354444754,
                         stories=len(rows), chinese_edited=sum(r['chinese_mode']=='context_edited' for r in rows),
                         rejections=dict(Counter(r['chinese_rejection'] for r in rows if r['chinese_mode']!='context_edited')),
                         cumulative_budget=ledger.snapshot()['estimated_peak_cost_rmb'], smtp='NOT_CONFIGURED_NOT_SENT')
          (out/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print('REPLAY_SUMMARY='+json.dumps(summary,ensure_ascii=False),flush=True)
          soup=BeautifulSoup((first/'edition.html').read_text(),'html.parser')
          articles=soup.select('article.article')
          assert len(articles)==len(rows), (len(articles),len(rows))
          for element,row in zip(articles,rows):
              heading=element.find('h3')
              assert heading is not None
              heading.string=row['title_after']
              paragraphs=element.select('.story-line .zh')
              assert len(paragraphs)==len(row['pairs_after'])
              for paragraph,pair in zip(paragraphs,row['pairs_after']):
                  paragraph.string=pair['zh']
          page=str(soup)
          (out/'edition.html').write_text(page)
          (out/'edition.txt').write_text(soup.get_text('\n',strip=True))
          write_pdf(page,out/'edition.pdf')
          assert ledger.spent_ceiling<=Decimal('1')
          assert summary['chinese_edited']>=11, 'Human acceptance still required: too many Chinese fallbacks'
          PY
      - name: Preserve replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-writing-replay
          path: /tmp/newspaper-writing-replay
          retention-days: 7
          if-no-files-found: warn
