name: Newspaper - Global Situation PDF
on:
  pull_request:
    paths:
      - 'newspaper/**'
      - '.github/workflows/newspaper.yml'
  # Beijing 00:01 startup; later ticks recover missed GitHub schedule events.
  # Each tick builds and sends immediately when ready; one receipt per edition.
  schedule:
    - cron: '1 16 * * *'
    - cron: '16 16 * * *'
    - cron: '31 16 * * *'
    - cron: '46 16 * * *'
    - cron: '7 17 * * *'
    - cron: '37 17 * * *'
    - cron: '7 18 * * *'
    - cron: '7 19 * * *'
    - cron: '7 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only; do not send'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      preview_kind:
        description: 'Preview mock layout or recent real news'
        required: false
        default: 'demo'
        type: choice
        options: ['demo', 'live']
permissions:
  contents: read
concurrency:
  group: newspaper-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'daily-live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quick_check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python syntax
        run: python -m compileall -q newspaper
      - name: Install lightweight test dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' 'scikit-learn>=1.4,<2'
      - name: Verify newspaper config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('newspaper/feeds.json').read_text(encoding='utf8'))
          assert next(iter(cfg['max_per_category'])) == '美股·全球金融市场'
          assert any(feed['name']=='36氪综合' and feed['url']=='https://www.36kr.com/feed'
                     and not feed.get('disabled',False)
                     for group in cfg['feeds'].values() for feed in group)
          PY
      - name: Check authoritative timetable against workflow cron
        run: python newspaper/verify_schedule.py

      - name: Focused regression suite
        env:
          PYTHONPATH: newspaper
        run: |
          python -m unittest -v test_prepared_delivery test_mail_secret_boundary test_market_source_provenance test_people_overseas_monitor test_treasury_yields test_market_web_quotes test_editorial_quality test_editorial_topic_relevance test_headline_quality test_p1_benchmark test_market_coverage_funnel test_sec_edgar test_market_readability_probe test_p1_decision_trace
      - name: Measure P1 labeled fixture baseline (no network / no model)
        run: python newspaper/editorial_benchmark.py
      - name: Preserve P1 frozen-case benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-p1-benchmark
          path: /tmp/newspaper-p1-benchmark.json
          if-no-files-found: warn
          retention-days: 14

  digest:
    needs: quick_check
    if: ${{ always() && (github.event_name != 'pull_request' || needs.quick_check.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
      SMTP_HOST: smtp.qq.com
      SMTP_PORT: '465'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve edition date
        id: date
        run: echo "edition=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"

      - name: Select production phase from canonical policy
        id: phase
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          python newspaper/schedule_contract.py --event "$EVENT" --cron "$CRON" --dry-run "$DRY_RUN"

      - name: Check sent receipt (never means inbox delivery)
        id: receipt
        if: steps.phase.outputs.phase == 'prepare' || steps.phase.outputs.phase == 'send'
        uses: actions/cache/restore@v4
        with:
          key: newspaper-sent-${{ steps.date.outputs.edition }}
          path: /tmp/newspaper-sent-receipt
          lookup-only: true

      - name: Restore prebuilt verified edition
        id: prepared
        if: (steps.phase.outputs.phase == 'prepare' || steps.phase.outputs.phase == 'send') && steps.receipt.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          key: newspaper-ready-v22-${{ steps.date.outputs.edition }}
          path: /tmp/newspaper-ready

      - name: Install print fonts
        if: steps.phase.outputs.phase == 'preview' || ((steps.phase.outputs.phase == 'prepare' || steps.phase.outputs.phase == 'send') && steps.receipt.outputs.cache-hit != 'true' && steps.prepared.outputs.cache-hit != 'true')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-liberation
          fc-match 'Noto Serif CJK SC'

      - name: Install newsroom dependencies
        if: steps.phase.outputs.phase == 'preview' || ((steps.phase.outputs.phase == 'prepare' || steps.phase.outputs.phase == 'send') && steps.receipt.outputs.cache-hit != 'true' && steps.prepared.outputs.cache-hit != 'true')
        run: python -m pip install -r newspaper/requirements.txt

      - name: Install English grammar model
        if: steps.phase.outputs.phase == 'preview' || ((steps.phase.outputs.phase == 'prepare' || steps.phase.outputs.phase == 'send') && steps.receipt.outputs.cache-hit != 'true' && steps.prepared.outputs.cache-hit != 'true')
        run: python -m spacy download en_core_web_sm

      - name: Cache offline translation model
        if: steps.phase.outputs.phase == 'preview' || ((steps.phase.outputs.phase == 'prepare' || steps.phase.outputs.phase == 'send') && steps.receipt.outputs.cache-hit != 'true' && steps.prepared.outputs.cache-hit != 'true')
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate/packages
          key: newspaper-argos-translate-en-zh-v1

      - name: Complete regression suite (PR only)
        if: github.event_name == 'pull_request'
        run: python -m unittest discover -s newspaper -p 'test_*.py' -v

      - name: Audit live public sources (PR only)
        if: github.event_name == 'pull_request'
        run: python newspaper/source_audit.py

      - name: Verify candidate market RSS feeds on actual GitHub runner (PR only)
        if: github.event_name == 'pull_request'
        run: python newspaper/probe_market_sources.py

      - name: Probe actual market article readability (PR only)
        if: github.event_name == 'pull_request'
        run: python newspaper/market_readability_probe.py

      - name: Archive market readability evidence (PR only)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-p1-market-readability
          path: /tmp/newspaper-market-readability.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Archive market-source verification evidence (PR only)
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-p1-market-source-probe
          path: /tmp/newspaper-market-source-probe.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Preview without SMTP or LLM credentials
        if: steps.phase.outputs.phase == 'preview'
        env:
          PREVIEW_KIND: ${{ inputs.preview_kind || 'demo' }}
        run: |
          set -euo pipefail
          if [[ "$PREVIEW_KIND" == "live" ]]; then
            python newspaper/digest.py --dry-run --rolling-preview --output /tmp/newspaper-preview
          else
            python newspaper/digest.py --demo --output /tmp/newspaper-preview
          fi

      - name: Live-source PDF integration (PR only; no credentials)
        if: github.event_name == 'pull_request'
        run: python newspaper/digest.py --dry-run --rolling-preview --output /tmp/newspaper-live-qa

      - name: Prepare verified edition (no SMTP credentials)
        id: build
        if: (steps.phase.outputs.phase == 'prepare' || steps.phase.outputs.phase == 'send') && steps.receipt.outputs.cache-hit != 'true' && steps.prepared.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        env:
          NEWSPAPER_LLM_API_KEY: ${{ secrets.NEWSPAPER_LLM_API_KEY }}
          NEWSPAPER_SEC_CONTACT: ${{ secrets.NEWSPAPER_SEC_CONTACT }}
        run: |
          set -euo pipefail
          python newspaper/digest.py --prepare --output /tmp/newspaper-ready

      - name: Cache completed edition for recovery attempts
        id: save_prepared
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          key: newspaper-ready-v21-${{ steps.date.outputs.edition }}
          path: /tmp/newspaper-ready

      - name: Send prebuilt edition via SMTP (default branch only)
        id: send
        if: steps.phase.outputs.phase == 'send' && steps.receipt.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        env:
          SMTP_FROM: ${{ secrets.NEWSPAPER_SMTP_FROM }}
          SMTP_PASSWORD: ${{ secrets.NEWSPAPER_SMTP_PASSWORD }}
          NEWSPAPER_TO: ${{ secrets.NEWSPAPER_TO }}
        run: |
          set -euo pipefail
          python newspaper/prepared_delivery.py --bundle-dir /tmp/newspaper-ready --edition-date "${{ steps.date.outputs.edition }}"

      - name: Make accepted-mail receipt
        if: steps.send.outcome == 'success'
        run: |
          mkdir -p /tmp/newspaper-sent-receipt
          printf '%s\n' "${{ steps.date.outputs.edition }}" > /tmp/newspaper-sent-receipt/date.txt

      - name: Save accepted-mail receipt
        id: save_receipt
        if: steps.send.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          key: newspaper-sent-${{ steps.date.outputs.edition }}
          path: /tmp/newspaper-sent-receipt

      - name: Publish explicit delivery status
        if: ${{ always() && steps.phase.outputs.phase != 'preview' }}
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          SENT_CACHE: ${{ steps.receipt.outputs.cache-hit }}
          READY_CACHE: ${{ steps.prepared.outputs.cache-hit }}
          BUILD: ${{ steps.build.outcome }}
          SEND: ${{ steps.send.outcome }}
          RECEIPT: ${{ steps.save_receipt.outcome }}
          READY_SAVED: ${{ steps.save_prepared.outcome }}
        run: |
          set -euo pipefail
          if [[ "$SENT_CACHE" == "true" ]]; then
            status=ALREADY_SENT
          elif [[ "$SEND" == "success" && "$RECEIPT" == "success" ]]; then
            status=SMTP_ACCEPTED
          elif [[ "$SEND" == "success" ]]; then
            status=SMTP_ACCEPTED_RECEIPT_UNVERIFIED
          else
            status=FAILED
          fi
          echo "NEWSPAPER_DELIVERY_STATUS=$status edition=${{ steps.date.outputs.edition }}"
          {
            echo "### Newspaper V2"
            echo "- Edition (Beijing): ${{ steps.date.outputs.edition }}"
            echo "- Status: **$status**"
            echo "- Prepared cache hit: $READY_CACHE"
            echo "- SMTP accepted is not inbox-delivered confirmation"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" == FAILED || "$status" == SMTP_ACCEPTED_RECEIPT_UNVERIFIED ]]; then
            echo "::error::Review newspaper run before retry: $status"
            exit 1
          fi

      - name: Preserve P1 observed-feed selection audit
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-p1-selection-audit
          path: |
            /tmp/newspaper-selection-audit.json
            /tmp/newspaper-source-audit.json
            /tmp/newspaper-market-funnel.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload PR preview
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-demo-preview
          path: |
            /tmp/newspaper-preview.html
            /tmp/newspaper-preview.txt
            /tmp/newspaper-preview.pdf
            /tmp/newspaper-live-qa.pdf
            /tmp/newspaper-live-qa.html
            /tmp/newspaper-live-qa.txt
            /tmp/newspaper-live-qa.market.json
            /tmp/newspaper-live-qa.editorial.json
            /tmp/newspaper-preview.editorial.json
            /tmp/newspaper-preview.market.json
          retention-days: 3
