name: Newspaper - Global Situation PDF
on:
  pull_request:
    paths:
      - 'newspaper/**'
      - '.github/workflows/newspaper.yml'
  # Explicit owner-requested one-time deliveries only; normal cron unchanged.
  # Quality sample uses its own non-receipted path; never consumes the daily slot.
  push:
    branches: [main]
    paths:
      - 'newspaper/V05_MAIL_TEST_REQUEST.txt'
  schedule:
    - cron: '3 17 * * *' # Beijing 01:03 (UTC previous date)
    - cron: '18 17 * * *' # Beijing 01:18 fallback
    - cron: '33 17 * * *' # Beijing 01:33 fallback
    - cron: '43 17 * * *' # Beijing 01:43 final fallback
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate demo without sending an email'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      preview_kind:
        description: 'When dry_run=true: mock layout or real latest-news reading'
        required: false
        default: 'demo'
        type: choice
        options: ['demo', 'live']
permissions:
  contents: read
concurrency:
  group: newspaper-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'daily-live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Fast, offline PR gate: run syntax/config and focused regressions before the
  # expensive fonts, spaCy, offline translation and full newspaper integration.
  # Scheduled/owner-dispatched delivery skips this gate and keeps its timing.
  quick_check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python syntax
        run: python -m compileall -q newspaper
      - name: Install only lightweight test dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' 'scikit-learn>=1.4,<2'
      - name: Verify news-source configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('newspaper/feeds.json').read_text(encoding='utf-8'))
          assert next(iter(cfg['max_per_category'])) == '美股·全球金融市场'
          feeds = [item for group in cfg['feeds'].values() for item in group]
          verified_36kr = [item for item in feeds if item['name'] == '36氪综合']
          assert len(verified_36kr) == 1
          assert verified_36kr[0]['url'] == 'https://www.36kr.com/feed'
          assert not verified_36kr[0].get('disabled', False)
          print('News-source configuration: OK (offline schema/safety check)')
          PY
      - name: Fast focused regression tests (no network)
        env:
          PYTHONPATH: newspaper
        run: python -m unittest -v test_market_source_provenance test_people_overseas_monitor test_treasury_yields test_market_web_quotes test_editorial_quality test_editorial_topic_relevance test_headline_quality

  digest:
    # On PRs, avoid heavyweight setup if the fast gate fails.
    # On schedule/manual/main events, quick_check is skipped: preserve delivery.
    needs: quick_check
    if: ${{ always() && (github.event_name != 'pull_request' || needs.quick_check.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Shanghai
      SMTP_HOST: smtp.qq.com
      SMTP_PORT: '465'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: newspaper/requirements.txt
      - name: Resolve Beijing delivery date
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[newspaper-v05-send-once]')))
        id: delivery_date
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
      - name: Check already-sent daily receipt
        if: steps.delivery_date.outcome == 'success'
        id: receipt
        uses: actions/cache/restore@v4
        with:
          path: /tmp/newspaper-sent-receipt
          key: newspaper-sent-${{ steps.delivery_date.outputs.date }}
          lookup-only: true
      - name: Refuse production outside the Beijing morning dispatch window
        if: steps.delivery_date.outcome == 'success' && steps.receipt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          hhmm=$(TZ=Asia/Shanghai date +%H%M)
          if [ "$hhmm" -lt 100 ] || [ "$hhmm" -ge 230 ]; then
            echo "::error::Beijing time outside 01:00-02:30. Aborting to prevent a report delivered after 02:30."
            exit 1
          fi
      - name: Install print fonts on GitHub runner
        if: steps.receipt.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-liberation
          fc-match 'Noto Serif CJK SC'
      - name: Install dependencies
        if: steps.receipt.outputs.cache-hit != 'true'
        run: python -m pip install -r newspaper/requirements.txt
      - name: Install English grammatical analysis model (spaCy official)
        if: steps.receipt.outputs.cache-hit != 'true'
        run: python -m spacy download en_core_web_sm
      - name: Cache offline translation model
        if: steps.receipt.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate/packages
          key: newspaper-argos-translate-en-zh-v1
      - name: Test date filtering, fallback, rendering
        if: github.event_name == 'pull_request'
        run: python -m unittest discover -s newspaper -p 'test_*.py' -v
      - name: Audit live public RSS source coverage — no secrets
        if: github.event_name == 'pull_request'
        run: python newspaper/source_audit.py
      - name: Preview only — never load SMTP secrets
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
        env:
          PREVIEW_KIND: ${{ inputs.preview_kind || 'demo' }}
        run: |
          set -euo pipefail
          if [ "$PREVIEW_KIND" = "live" ]; then
            python newspaper/digest.py --dry-run --rolling-preview --output /tmp/newspaper-preview
          else
            python newspaper/digest.py --demo --output /tmp/newspaper-preview
          fi
      - name: Integration test — real public news, source selection, FRED and PDF, no secrets
        if: github.event_name == 'pull_request'
        run: python newspaper/digest.py --dry-run --rolling-preview --output /tmp/newspaper-live-qa
      - name: Send real PDF daily report — default branch only
        if: steps.receipt.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false') || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[newspaper-v05-send-once]') || contains(github.event.head_commit.message, '[newspaper-quality-sample]'))))
        env:
          SMTP_FROM: ${{ secrets.NEWSPAPER_SMTP_FROM }}
          SMTP_PASSWORD: ${{ secrets.NEWSPAPER_SMTP_PASSWORD }}
          NEWSPAPER_TO: ${{ secrets.NEWSPAPER_TO }}
          NEWSPAPER_LLM_API_KEY: ${{ secrets.NEWSPAPER_LLM_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SMTP_FROM" ] || [ -z "$SMTP_PASSWORD" ] || [ -z "$NEWSPAPER_TO" ]; then
            echo "::error::Not configured. Set NEWSPAPER_SMTP_FROM, NEWSPAPER_SMTP_PASSWORD, NEWSPAPER_TO in GitHub Actions repository Secrets."
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "push" && "${{ contains(github.event.head_commit.message, '[newspaper-quality-sample]') }}" == "true" ]]; then
            # Quality sample: uses live public news + QQ SMTP, but does not
            # alter the official daily delivery receipt or 01:00 deadline.
            python newspaper/digest.py --quality-sample
          else
            python newspaper/digest.py
          fi
      - name: Record successful daily delivery
        if: steps.delivery_date.outcome == 'success' && steps.receipt.outputs.cache-hit != 'true' && success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[newspaper-v05-send-once]')))
        run: |
          mkdir -p /tmp/newspaper-sent-receipt
          printf '%s\\n' "${{ steps.delivery_date.outputs.date }}" > /tmp/newspaper-sent-receipt/date.txt
      - name: Save successful daily receipt
        if: steps.delivery_date.outcome == 'success' && steps.receipt.outputs.cache-hit != 'true' && success() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[newspaper-v05-send-once]')))
        uses: actions/cache/save@v4
        with:
          path: /tmp/newspaper-sent-receipt
          key: newspaper-sent-${{ steps.delivery_date.outputs.date }}
      - name: Upload example preview
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-demo-preview
          path: |
            /tmp/newspaper-preview.html
            /tmp/newspaper-preview.txt
            /tmp/newspaper-preview.pdf
            /tmp/newspaper-source-audit.json
            /tmp/newspaper-live-qa.pdf
            /tmp/newspaper-live-qa.html
            /tmp/newspaper-live-qa.txt
            /tmp/newspaper-live-qa.market.json
            /tmp/newspaper-live-qa.editorial.json
            /tmp/newspaper-preview.editorial.json
            /tmp/newspaper-preview.market.json
          retention-days: 3
