name: Newspaper - Global Situation PDF
on:
  pull_request:
    paths: ['newspaper/**', '.github/workflows/newspaper.yml']
  push:
    branches: [main]
    paths: ['newspaper/V05_MAIL_TEST_REQUEST.txt', 'newspaper/RECOVERY_REQUEST.json']
  schedule:
    - cron: '37 22 * * *' # Prepare 06:37 Beijing; transmit no earlier than 07:00
    - cron: '7 23 * * *' # 07:07 recovery
    - cron: '20 23 * * *' # 07:20 recovery
    - cron: '20 0,1 * * *' # 08:20 / 09:20 recovery
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate preview without sending'
        default: 'true'
        type: choice
        options: ['true', 'false']
      preview_kind:
        description: 'demo or live source preview'
        default: 'demo'
        type: choice
        options: ['demo', 'live']
permissions:
  contents: read
concurrency:
  group: newspaper-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'daily-live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: newspaper/requirements.txt
      - name: Install print fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-liberation
      - name: Install dependencies and English model
        run: |
          python -m pip install -r newspaper/requirements.txt
          python -m spacy download en_core_web_sm
      - name: Cache offline translation model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate/packages
          key: newspaper-argos-translate-en-zh-v1
      - name: Test date filtering, fallback, rendering and delivery failure modes
        run: python -m unittest discover -s newspaper -p 'test_*.py' -v
      - name: Preview only — never load SMTP secrets
        env:
          PREVIEW_KIND: ${{ inputs.preview_kind || 'live' }}
        run: |
          set -euo pipefail
          if [ "$PREVIEW_KIND" = "live" ]; then
            python newspaper/digest.py --dry-run --output /tmp/newspaper-preview
          else
            python newspaper/digest.py --demo --output /tmp/newspaper-preview
          fi
      - name: Upload example preview
        uses: actions/upload-artifact@v4
        with:
          name: newspaper-demo-preview
          path: /tmp/newspaper-preview.*
          retention-days: 3
  preflight:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false') || (github.event_name == 'push' && (contains(github.event.head_commit.message, '[newspaper-recover]') || contains(github.event.head_commit.message, '[newspaper-v05-send-once]'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      date: ${{ steps.journal.outputs.date }}
      decision: ${{ steps.journal.outputs.decision }}
      legacy_sent: ${{ steps.legacy.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - name: Check durable journal before expensive work
        id: journal
        env:
          GH_TOKEN: ${{ github.token }}
        run: python newspaper/delivery_state.py --check
      - name: Respect receipts created before V0.9
        id: legacy
        uses: actions/cache/restore@v4
        with:
          path: /tmp/newspaper-sent-receipt
          key: newspaper-sent-${{ steps.journal.outputs.date }}
          lookup-only: true
  delivery:
    needs: preflight
    if: needs.preflight.outputs.decision == 'send' && needs.preflight.outputs.legacy_sent != 'true' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TZ: Asia/Shanghai
      SMTP_HOST: smtp.qq.com
      SMTP_PORT: '465'
      DELIVERY_DATE: ${{ needs.preflight.outputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: newspaper/requirements.txt
      - name: Install print fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-liberation
      - name: Install dependencies and English model
        run: |
          python -m pip install -r newspaper/requirements.txt
          python -m spacy download en_core_web_sm
      - name: Cache offline translation model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate/packages
          key: newspaper-argos-translate-en-zh-v1
      - name: Restore prepared edition for same-day retry
        id: edition
        uses: actions/cache/restore@v4
        with:
          path: /tmp/newspaper-edition
          key: newspaper-ready-v09-${{ env.DELIVERY_DATE }}
      - name: Prepare complete edited PDF and separate commentary
        env:
          GH_TOKEN: ${{ github.token }}
          NEWSPAPER_LLM_API_KEY: ${{ secrets.NEWSPAPER_LLM_API_KEY }}
        run: python newspaper/digest.py --prepare-only --delivery-date "$DELIVERY_DATE"
      - name: Checkpoint edition before attempting SMTP
        if: steps.edition.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/newspaper-edition
          key: newspaper-ready-v09-${{ env.DELIVERY_DATE }}
      - name: Send real PDF daily report — default branch only
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SMTP_FROM: ${{ secrets.NEWSPAPER_SMTP_FROM }}
          SMTP_PASSWORD: ${{ secrets.NEWSPAPER_SMTP_PASSWORD }}
          NEWSPAPER_TO: ${{ secrets.NEWSPAPER_TO }}
        run: python newspaper/digest.py --send-ready --delivery-date "$DELIVERY_DATE"
      - name: Record run outcome without credentials or source text
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          echo "### Newspaper delivery $DELIVERY_DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "Job: $JOB_STATUS. SMTP acceptance is recorded on newspaper-delivery-state; it is not inbox confirmation." >> "$GITHUB_STEP_SUMMARY"
          if [ "$JOB_STATUS" != "success" ]; then
            echo "::error::Daily edition incomplete. Independent watchdog checks the durable journal; do not blindly resend an uncertain SMTP transaction."
          fi
