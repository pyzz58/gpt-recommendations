name: Strategic intelligence runtime tests

on:
  push:
    paths:
      - 'newspaper/strategic-intelligence/**'
      - '.github/workflows/strategic-intelligence-runtime.yml'
  pull_request:
    paths:
      - 'newspaper/strategic-intelligence/**'
      - '.github/workflows/strategic-intelligence-runtime.yml'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: newspaper/strategic-intelligence
    env:
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/strategic-intelligence-venv
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install tested uv version
        run: python -m pip install --disable-pip-version-check uv==0.12.23
      - name: Rebuild locked minimal environment
        run: uv sync --locked
      - name: Verify actual archive transactions and CLI
        run: uv run --locked python -m unittest discover -s tests_runtime -v
      - name: Verify canonical projections
        run: python tools/sync_spec.py --check
      - name: Verify technical and work-plan correspondence
        run: |
          python tools/sync_spec.py --check-technical
          python tools/sync_spec.py --check-work-plan
