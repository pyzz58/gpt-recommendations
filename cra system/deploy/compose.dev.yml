name: cra-w01-development

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: cra
      POSTGRES_USER: cra
      POSTGRES_PASSWORD: synthetic
    ports:
      - "${CRA_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cra -d cra"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cra_w01_postgres:/var/lib/postgresql

volumes:
  cra_w01_postgres:
