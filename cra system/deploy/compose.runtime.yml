name: cra-runtime

x-api-environment: &api-environment
  CRA_ENV: ${CRA_ENV:-production}
  CRA_DATABASE_URL: ${CRA_DATABASE_URL:?set a private PostgreSQL URL}
  CRA_SESSION_SECRET: ${CRA_SESSION_SECRET:?set a managed session secret}
  CRA_SESSION_COOKIE_SECURE: ${CRA_SESSION_COOKIE_SECURE:-true}
  CRA_PUBLIC_BASE_URL: ${CRA_PUBLIC_BASE_URL:?set the approved HTTPS URL}
  CRA_OIDC_ISSUER: ${CRA_OIDC_ISSUER:?set the approved OIDC issuer}
  CRA_OIDC_CLIENT_ID: ${CRA_OIDC_CLIENT_ID:?set the approved OIDC client}
  CRA_OIDC_CLIENT_SECRET: ${CRA_OIDC_CLIENT_SECRET:?set the managed OIDC secret}
  CRA_STORAGE_BACKEND: ${CRA_STORAGE_BACKEND:-s3}
  CRA_PRIVATE_STORAGE_LOCAL_PATH: /data/private
  CRA_PRIVATE_STORAGE_ENDPOINT: ${CRA_PRIVATE_STORAGE_ENDPOINT:-}
  CRA_PRIVATE_STORAGE_ACCESS_KEY: ${CRA_PRIVATE_STORAGE_ACCESS_KEY:-}
  CRA_PRIVATE_STORAGE_SECRET_KEY: ${CRA_PRIVATE_STORAGE_SECRET_KEY:-}
  CRA_PRIVATE_STORAGE_BUCKET: ${CRA_PRIVATE_STORAGE_BUCKET:-cra-private}
  CRA_PRIVATE_STORAGE_REGION: ${CRA_PRIVATE_STORAGE_REGION:-us-east-1}
  CRA_COMMON_POLICY_PATH: ${CRA_COMMON_POLICY_PATH:-}
  CRA_MODEL_PROVIDER: disabled
  CRA_ANALYSIS_PROVIDER: disabled
  CRA_ANALYSIS_DATA_CLASSIFICATION: disabled
  CRA_OCR_PROVIDER: ${CRA_OCR_PROVIDER:-disabled}
  CRA_MAX_UPLOAD_BYTES: ${CRA_MAX_UPLOAD_BYTES:-20971520}

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CRA_DB_NAME:-cra}
      POSTGRES_USER: ${CRA_DB_USER:-cra}
      POSTGRES_PASSWORD: ${CRA_DB_PASSWORD:?set a managed database password}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CRA_DB_USER:-cra} -d ${CRA_DB_NAME:-cra}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  migrate:
    image: ${CRA_API_IMAGE:-cra-api:runtime}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["uv", "run", "--frozen", "alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  api:
    image: ${CRA_API_IMAGE:-cra-api:runtime}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command:
      [
        "uv",
        "run",
        "--frozen",
        "uvicorn",
        "cra_app.main:app",
        "--app-dir",
        "backend",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*"
      ]
    environment: *api-environment
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - private_storage:/data/private
    networks:
      - backend

  worker:
    image: ${CRA_API_IMAGE:-cra-api:runtime}
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command:
      [
        "uv",
        "run",
        "--frozen",
        "python",
        "-m",
        "cra_app.documents.worker"
      ]
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - private_storage:/data/private
    networks:
      - backend

  web:
    image: ${CRA_WEB_IMAGE:-cra-web:runtime}
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${CRA_RUNTIME_BIND:-127.0.0.1:8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=64m
      - /var/run:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend
      - edge

volumes:
  postgres_data:
  private_storage:

networks:
  backend:
    internal: true
  edge:
