[project]
name = "cra-system"
version = "0.1.0"
description = "CRA monitoring workbench engineering baseline"
readme = "README.md"
requires-python = ">=3.13.15,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "authlib>=1.9,<2",
    "boto3>=1.43,<2",
    "fastapi>=0.162,<1",
    "itsdangerous>=2.2,<3",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11.10,<0.12",
    "procrastinate>=3.10,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-docx>=1.2,<2",
    "python-multipart>=0.0.32,<1",
    "sqlalchemy>=2.0.41,<2.1",
    "uvicorn[standard]>=0.54,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/cra_app"]

[dependency-groups]
dev = [
    "httpx2>=2.16,<3",
    "pytest>=8.4,<10",
    "reportlab>=4.4,<5",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: requires CRA_TEST_DATABASE_URL pointing to a disposable PostgreSQL 18 database",
]

[tool.uv]
managed = true
