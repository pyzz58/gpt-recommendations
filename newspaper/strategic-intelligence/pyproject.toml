[project]
name = "strategic-intelligence"
version = "0.1.0"
description = "Shared version and archive interfaces for the strategic intelligence application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.14,<3",
  "sqlalchemy>=2.0.55,<2.2",
]

[project.optional-dependencies]
workflow = [
    "langgraph>=1.2,<1.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
