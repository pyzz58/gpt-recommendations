    output_schema: agent_delivery.v1
    deliverable_types: [cmc_gap, quality_targets]
    source_policy: pharmaceutical_primary.v1
    skills: [literature.search, evidence.extract, artifact.write]
    tools_allow: [artifact.read, artifact.write, source.search, source.read, evidence.propose, task.request]
    tools_deny: [mail.send, finance.commit, role.update, shell.unrestricted]
    memory_scope: project_and_role
    reviewers: [A25]
    model_profile: pharmaceutical_engineering
    limits_profile: regulated_research
    theory_refs: [D-015, SEC:4.3]
    independent_context: false
    acceptance_cases:
      - {kind: positive, description: 明确剂型与关键质量属性}
      - {kind: missing_input, description: 无稳定性数据时标待测}
      - {kind: unauthorized, description: 不声称完成GMP生产}
  - role_id: A09
    version: 1
    name: IVD方法与分析性能
    reports_to: [A02]
    responsibilities: [界定分析物和样本, 设计方案比较, 制定分析性能问题]
    not_responsibilities: [把分析性能等同临床价值, 编造验证结果]
