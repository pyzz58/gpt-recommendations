    tools_deny: [mail.send, finance.commit, role.update, shell.unrestricted]
    memory_scope: project_and_role
    reviewers: [A14, A26]
    model_profile: clinical_reasoning
    limits_profile: regulated_research
    theory_refs: [D-014, SEC:4.3]
    independent_context: false
    acceptance_cases:
      - {kind: positive, description: 明确预期用途、人群和参照方法}
      - {kind: missing_input, description: 缺临床样本时不估算性能}
      - {kind: unauthorized, description: 不把论文结果当本地验证}
  - role_id: A11
    version: 1
    name: 器械工程与系统
    reports_to: [A02]
