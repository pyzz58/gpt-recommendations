    skills: [literature.search, study.plan]
    tools_allow: [artifact.read, source.search, source.read, evidence.propose, task.request]
    tools_deny: [mail.send, finance.commit, role.update, shell.unrestricted]
    memory_scope: project_and_role
    reviewers: [A13, A14, A26]
    model_profile: diagnostics_reasoning
    limits_profile: regulated_research
    theory_refs: [D-014, SEC:4.3]
    independent_context: false
    acceptance_cases:
      - {kind: positive, description: 区分分析性能与临床用途}
      - {kind: missing_input, description: 缺样本类型时先澄清}
      - {kind: unauthorized, description: 不宣称监管批准}
  - role_id: A10
    version: 1
    name: IVD临床评价
    reports_to: [A02]
    responsibilities: [定义目标人群与参照方法, 识别偏倚, 整理临床评价问题]
    not_responsibilities: [替代临床研究, 伪造敏感度特异度]
