知识资料库</text><text x="272" y="150" font-size="30" fill="#1f354d" font-weight="700">知识资料库</text><text x="272" y="181" font-size="15" fill="#667b92" font-weight="400">保存原件 · 检索引用 · 管理版本 · 支持外包交接</text><rect x="894" y="121" width="144" height="40" rx="10" fill="#1f65b5" stroke="none"/><text x="922" y="147" font-size="16" fill="#ffffff" font-weight="700">上传资料</text><rect x="272" y="209" width="766" height="100" rx="10" fill="#ffffff" stroke="#b9cce1"/><text x="296" y="246" font-size="18" fill="#294b70" font-weight="700">拖入文件，或点击“上传资料”</text><text x="296" y="274" font-size="14" fill="#667b92" font-weight="400">PDF / Word / Excel / CSV / 图片 / 邮件；默认保存到当前项目</text><rect x="272" y="326" width="766" height="42" rx="8" fill="#ffffff" stroke="none"/><text x="288" y="353" font-size="15" fill="#8293a4" font-weight="400">搜索文件、关键词或资料中的问题…</text><text x="277" y="402" font-size="16" fill="#1f65b5" font-weight="700">全部资料  8</text><text x="430" y="402" font-size="16" fill="#667b92" font-weight="400">待核查  2</text><text x="575" y="402" font-size="16" fill="#667b92" font-weight="400">项目产出  3</text><text x="730" y="402" font-size="16" fill="#667b92" font-weight="400">历史版本</text><rect x="272" y="421" width="766" height="292" rx="10" fill="#ffffff" stroke="none"/><rect x="272" y="421" width="766" height="42" rx="8" fill="#eaf0f6" stroke="none"/><text x="290" y="448" font-size="14" fill="#60758c" font-weight="700">名称 / 类别</text><text x="658" y="448" font-size="14" fill="#60758c" font-weight="700">版本</text><text x="746" y="448" font-size="14" fill="#60758c" font-weight="700">处理</text><text x="870" y="448" font-size="14" fill="#60758c" font-weight="700">核查</text><text x="290" y="495" font-size="15" fill="#274b73" font-weight="400">实验方案.pdf</text><text x="290" y="515" font-size="12" fill="#8191a3" font-weight="400">研究方案</text><text x="658" y="495" font-size="14" fill="#243447" font-weight="400">V2</text><text x="746" y="495" font-size="14" fill="#267861" font-weight="400">可检索</text><text x="870" y="495" font-size="14" fill="#92702c" font-weight="400">待核查</text><rect x="280" y="524" width="750" height="57" rx="6" fill="#eef5ff" stroke="none"/><text x="290" y="555" font-size="15" fill="#274b73" font-weight="700">外包交付-演示结果.xlsx</text><text x="290" y="575" font-size="12" fill="#8191a3" font-weight="400">中心实验室 · 合成数据</text><text x="658" y="555" font-size="14" fill="#243447" font-weight="400">V1</text><text x="746" y="555" font-size="14" fill="#267861" font-weight="400">可检索</text><text x="870" y="555" font-size="14" fill="#92702c" font-weight="400">未核查</text><text x="290" y="615" font-size="15" fill="#274b73" font-weight="400">CDMO-演示报价.pdf</text><text x="290" y="635" font-size="12" fill="#8191a3" font-weight="400">报价资料</text><text x="658" y="615" font-size="14" fill="#243447" font-weight="400">V1</text><text x="746" y="615" font-size="14" fill="#267861" font-weight="400">可检索</text><text x="870" y="615" font-size="14" fill="#92702c" font-weight="400">范围已核</text><text x="290" y="675" font-size="15" fill="#274b73" font-weight="400">扫描附件.pdf</text><text x="290" y="695" font-size="12" fill="#8191a3" font-weight="400">研究资料</text><text x="658" y="675" font-size="14" fill="#243447" font-weight="400">V1</text><text x="746" y="675" font-size="14" fill="#ab6a13" font-weight="400">部分识别</text><text x="870" y="675" font-size="14" fill="#92702c" font-weight="400">需复核</text><rect x="1060" y="121" width="352" height="655" rx="10" fill="#ffffff" stroke="none"/><text x="1082" y="157" font-size="20" fill="#243f5d" font-weight="700">资料详情与原文引用</text><text x="1082" y="194" font-size="17" fill="#195aa6" font-weight="700">外包交付-演示结果.xlsx</text><text x="1082" y="224" font-size="14" fill="#667b92" font-weight="400">项目私有 · V1 · 原件保留</text><rect x="1080" y="247" width="310" height="60" rx="8" fill="#fff5df" stroke="none"/><text x="1095" y="273" font-size="15" fill="#92681d" font-weight="700">未核查 · 合成演示资料</text><text x="1095" y="296" font-size="13" fill="#92681d" font-weight="400">可检索不代表数据或结论已证实</text><text x="1082" y="347" font-size="15" fill="#60758c" font-weight="700">引用位置</text><text x="1082" y="379" font-size="18" fill="#195aa6" font-weight="700">Results ! B2:D4</text><text x="1082" y="409" font-size="14" fill="#667b92" font-weight="400">点击打开原文件并定位</text><text x="1082" y="460" font-size="15" fill="#60758c" font-weight="700">关联任务</text><text x="1082" y="491" font-size="15" fill="#243447" font-weight="400">A15：检查交付字段与单位</text><text x="1082" y="521" font-size="15" fill="#243447" font-weight="400">A14：核查分析输入与范围</text><text x="1082" y="551" font-size="15" fill="#243447" font-weight="400">A26：检查结论与反证</text><rect x="1082" y="580" width="306" height="42" rx="8" fill="#e9f1ff" stroke="none"/><text x="1137" y="607" font-size="15" fill="#195aa6" font-weight="700">加入指定任务资料</text><text x="1082" y="664" font-size="14" fill="#667b92" font-weight="400">云端使用：仅本地</text><text x="1082" y="697" font-size="14" fill="#667b92" font-weight="400">新版本：保留旧版与影响清单</text><text x="1082" y="730" font-size="14" fill="#667b92" font-weight="400">备份：原件、权限、版本和引用</text><rect x="272" y="734" width="766" height="120" rx="10" fill="#eaf2fb" stroke="none"/><text x="292" y="767" font-size="18" fill="#294b70" font-weight="700">版本更新后的处理</text><text x="292" y="797" font-size="15" fill="#526e8b" font-weight="400">上传V2 → 比较变化 → 标记受影响任务 → 核查后修订</text><text x="292" y="828" font-size="14" fill="#667b92" font-weight="400">历史报告继续保留当时引用；实际外部操作单独核对。</text><text x="272" y="902" font-size="15" fill="#708297" font-weight="400">设计草图：文件、状态和任务均为合成示例；上传与检索应用尚未实现。</text></svg>

